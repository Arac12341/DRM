name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Served from the custom domain root (dreamsg.org) -> NO basePath, and
      # NO asset-path rewriting. public/CNAME is copied into out/ automatically.
      - name: Build and export
        run: npm run export

      - name: Show out/ contents (debug)
        run: ls -la out || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # Rewrites the CNAME on every deploy so the custom domain never drops.
          cname: dreamsg.org
