name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build and export
        run: npm run export
        env:
          NEXT_PUBLIC_BASE_PATH: '/DRM'

      - name: Fix exported asset paths
        run: |
          echo "Rewriting absolute-root asset paths to /DRM in out/"
          # Find files that reference absolute paths and rewrite them to the repo subpath.
          set -e
          files=$(grep -rl --exclude-dir=.git '/_next\|/dream-box-front.jpg\|/dream-box-back.jpg' out || true)
          if [ -n "$files" ]; then
            printf '%s\n' $files | xargs -r sed -i "s|href=\"/_next|href=\"/DRM/_next|g"
            printf '%s\n' $files | xargs -r sed -i "s|src=\"/_next|src=\"/DRM/_next|g"
            printf '%s\n' $files | xargs -r sed -i "s|/dream-box-front.jpg|/DRM/dream-box-front.jpg|g"
            printf '%s\n' $files | xargs -r sed -i "s|/dream-box-back.jpg|/DRM/dream-box-back.jpg|g"
            printf '%s\n' $files | xargs -r sed -i "s|\"/_next|\"/DRM/_next|g"
          fi

      - name: Show `out/` contents (debug)
        run: |
          echo "=== cwd: $(pwd) ==="
          ls -la
          echo "=== out/ ==="
          ls -la out || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
